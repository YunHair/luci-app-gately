name: Build luci-app-gately

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          releases_keep_latest: 5
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 5
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [openwrt-24.10, openwrt-25.12]
    steps:
      - uses: actions/checkout@v4
      - uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: luci-app-gately
          NO_REFRESH_CHECK: true
      - uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.sdk }}
          path: bin/packages/x86_64/packages_ci/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: ipks
          merge-multiple: true
      - name: List packaged files
        run: find ipks -type f | sort
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: luci-app-gately ${{ github.ref_name }}
          files: ipks/*
          generate_release_notes: true
          make_latest: true
